<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUMS | Teacher Management</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand">
            <h2><i class="fa-solid fa-graduation-cap"></i> SUMS</h2>
            <p>University System</p>
        </div>

        <nav>

            <a href="dashboard.html">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>

            <a href="students.html">
                <i class="fa-solid fa-user-graduate"></i> Students
            </a>

            <a href="Teacher.html" class="active">
                <i class="fa-solid fa-chalkboard-user"></i> Teachers
            </a>

            <a href="course.html">
                <i class="fa-solid fa-book"></i> Courses
            </a>

            <a href="department.html">
                <i class="fa-solid fa-building"></i> Departments
            </a>

            <a href="attendance.html">
                <i class="fa-solid fa-calendar-check"></i> Attendance
            </a>

            <a href="results.html">
                <i class="fa-solid fa-file-lines"></i> Results
            </a>

            <a href="index.html">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>

        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <!-- Topbar -->
        <header class="topbar">

            <div>
                <h1>Teacher Management</h1>
                <p>Manage all university teachers</p>
            </div>

        </header>


        <!-- Add Teacher -->
        <section class="content-box">

            <h2>Add New Teacher</h2>

            <form id="teacherForm" class="student-form">

                <input
                    type="text"
                    id="teacherName"
                    placeholder="Teacher Name"
                    required
                >

                <input
                    type="text"
                    id="teacherId"
                    placeholder="Teacher ID e.g. T101"
                    required
                >

                <input
                    type="email"
                    id="teacherEmail"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="text"
                    id="teacherDepartment"
                    placeholder="Department"
                    required
                >

                <button type="submit">
                    <i class="fa-solid fa-plus"></i> Add Teacher
                </button>

            </form>

        </section>


        <!-- All Teachers -->
        <section class="content-box">

            <h2>All Teachers</h2>

            <!-- Search Teacher -->
            <input
                type="text"
                id="searchTeacher"
                placeholder="Search teacher..."
            >

            <!-- Mobile Table Wrapper -->
            <div class="table-container">

                <table id="teacherTable">

                    <thead>

                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Teacher ID</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="teacherTableBody">

                        <!-- Teachers will appear here -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- JavaScript -->
<script src="script.js"></script>

</body>
</html>

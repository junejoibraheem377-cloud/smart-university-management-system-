<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUMS | Course Management</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="brand">
            <h2>
                <i class="fa-solid fa-graduation-cap"></i> SUMS
            </h2>

            <p>University System</p>
        </div>

        <nav>

            <a href="dashboard.html">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>

            <a href="students.html">
                <i class="fa-solid fa-user-graduate"></i> Students
            </a>

            <a href="Teacher.html">
                <i class="fa-solid fa-chalkboard-user"></i> Teachers
            </a>

            <a href="course.html" class="active">
                <i class="fa-solid fa-book"></i> Courses
            </a>

            <a href="department.html">
                <i class="fa-solid fa-building"></i> Departments
            </a>

            <a href="attendance.html">
                <i class="fa-solid fa-calendar-check"></i> Attendance
            </a>

            <a href="results.html">
                <i class="fa-solid fa-file-lines"></i> Results
            </a>

            <a href="#">
                <i class="fa-solid fa-bullhorn"></i> Notices
            </a>

            <a href="index.html">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Course Management</h1>
                <p>Manage university courses and instructors</p>
            </div>

        </header>


        <!-- ADD COURSE -->

        <section class="content-box">

            <h2>Add New Course</h2>

            <form id="courseForm" class="student-form">

                <input
                    type="text"
                    id="courseName"
                    placeholder="Course Name"
                    required
                >

                <input
                    type="text"
                    id="courseCode"
                    placeholder="Course Code"
                    required
                >

                <select id="courseDepartment" required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="IT">
                        IT
                    </option>

                </select>

                <input
                    type="text"
                    id="courseTeacher"
                    placeholder="Teacher Name"
                    required
                >

                <select id="courseSemester" required>

                    <option value="">
                        Select Semester
                    </option>

                    <option value="2nd">
                        2nd
                    </option>

                </select>

                <select id="courseCredits" required>

                    <option value="">
                        Select Credits
                    </option>

                    <option value="2">
                        2
                    </option>

                    <option value="3">
                        3
                    </option>

                </select>

                <button type="submit">
                    <i class="fa-solid fa-plus"></i> Add Course
                </button>

            </form>

        </section>


        <!-- COURSE LIST -->

        <section class="content-box student-list-box">

            <div class="list-header">

                <h2>All Courses</h2>

                <input
                    type="text"
                    id="searchCourse"
                    placeholder="Search course..."
                >

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Course Name</th>
                            <th>Course Code</th>
                            <th>Department</th>
                            <th>Teacher</th>
                            <th>Semester</th>
                            <th>Credits</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="courseTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>

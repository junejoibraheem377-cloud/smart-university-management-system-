<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUMS | Department Management</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand">
            <h2>🎓 SUMS</h2>
            <p>University System</p>
        </div>

        <nav>
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="students.html">👨‍🎓 Students</a>
            <a href="Teacher.html">👨‍🏫 Teachers</a>
            <a href="course.html">📚 Courses</a>
            <a href="department.html" class="active">🏢 Departments</a>
            <a href="attendance.html">📅 Attendance</a>
            <a href="results.html">📝 Results</a>
            <a href="index.html">🚪 Logout</a>
        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <!-- Topbar -->
        <header class="topbar">

            <div>
                <h1>Department Management</h1>
                <p>Manage university departments</p>
            </div>

        </header>


        <!-- Add Department -->
        <section class="content-box">

            <h2>Add New Department</h2>

            <form id="departmentForm" class="student-form">

                <input
                    type="text"
                    id="departmentName"
                    placeholder="Department Name"
                    required
                >

                <input
                    type="text"
                    id="departmentCode"
                    placeholder="Department Code e.g. CS101"
                    required
                >

                <button type="submit">
                    ➕ Add Department
                </button>

            </form>

        </section>


        <!-- All Departments -->
        <section class="content-box">

            <h2>All Departments</h2>

            <!-- Mobile Table Wrapper -->
            <div class="table-container">

                <table id="departmentTable">

                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Department Name</th>
                            <th>Department Code</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="departmentTableBody">
                        <!-- Departments will appear here -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<script>

    let departments =
        JSON.parse(localStorage.getItem("departments")) || [];

    const form =
        document.getElementById("departmentForm");

    const tableBody =
        document.getElementById("departmentTableBody");


    // Display Departments
    function renderTable() {

        tableBody.innerHTML = "";

        departments.forEach((dept, index) => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${dept.name}</td>
                <td>${dept.code}</td>
                <td>
                    <button
                        class="action-btn"
                        onclick="deleteDepartment(${index})">
                        🗑️ Delete
                    </button>
                </td>
            `;

            tableBody.appendChild(row);

        });
    }


    // Add Department
    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const name =
            document.getElementById("departmentName").value.trim();

        const code =
            document.getElementById("departmentCode").value.trim();


        if (name === "" || code === "") {
            return;
        }


        departments.push({
            name: name,
            code: code
        });


        localStorage.setItem(
            "departments",
            JSON.stringify(departments)
        );


        form.reset();

        renderTable();

    });


    // Delete Department
    function deleteDepartment(index) {

        departments.splice(index, 1);

        localStorage.setItem(
            "departments",
            JSON.stringify(departments)
        );

        renderTable();
    }


    // Load Departments
    renderTable();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMS | Student Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <h2>🎓 SUMS</h2>
            <p>University System</p>
        </div>

    <nav>

    <a href="dashboard.html">
        <i class="fa-solid fa-chart-line"></i> Dashboard
    </a>

    <a href="students.html" class="active">
        <i class="fa-solid fa-user-graduate"></i> Students
    </a>

    <a href="Teacher.html">
        <i class="fa-solid fa-chalkboard-user"></i> Teachers
    </a>

    <a href="course.html">
        <i class="fa-solid fa-book"></i> Courses
    </a>

    <a href="department.html">
        <i class="fa-solid fa-building"></i> Departments
    </a>

    <a href="attendance.html">
        <i class="fa-solid fa-calendar-check"></i> Attendance
    </a>

    <a href="results.html">
        <i class="fa-solid fa-file-lines"></i> Results
    </a>

    <a href="#">
        <i class="fa-solid fa-bullhorn"></i> Notices
    </a>

    <a href="index.html">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
    </a>

</nav>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Student Management</h1>
                <p>Manage all university students</p>
            </div>

            <div class="admin-profile">
                <span>👤</span>

                <div>
                    <strong>Administrator</strong>
                    <p>Admin</p>
                </div>
            </div>

        </header>


        <!-- ADD STUDENT -->
        <section class="content-box">

            <h2>Add New Student</h2>

            <form id="studentForm" class="student-form">

                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                    required
                >

                <input
                    type="text"
                    id="rollNumber"
                    placeholder="Roll Number"
                    required
                >

                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Email Address"
                    required
                >

                <select id="department" required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Software Engineering">
                        Software Engineering
                    </option>

                    <option value="Business Administration">
                        Business Administration
                    </option>

                    <option value="Engineering">
                        Engineering
                    </option>

                </select>

                <button type="submit">
                    ➕ Add Student
                </button>

            </form>

        </section>


        <!-- STUDENT LIST -->
        <section class="content-box student-list-box">

            <div class="list-header">

                <h2>All Students</h2>

                <input
                    type="text"
                    id="searchStudent"
                    placeholder="🔍 Search student..."
                >

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Name</th>
                            <th>Roll No.</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody id="studentTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>

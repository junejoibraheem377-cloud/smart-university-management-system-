<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SUMS | Student Management</title>


    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <h2>
                <i class="fa-solid fa-graduation-cap"></i> SUMS
            </h2>

            <p>University System</p>
        </div>

<nav>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="students.html" class="active">👨‍🎓 Students</a>
    <a href="Teacher.html">👨‍🏫 Teachers</a>
    <a href="course.html">📚 Courses</a>
    <a href="department.html">🏢 Departments</a>
    <a href="attendance.html">📅 Attendance</a>
    <a href="results.html">📝 Results</a>
    <a href="#">📢 Notices</a>
    <a href="index.html">🚪 Logout</a>
</nav>
        

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Student Management</h1>
                <p>Manage all university students</p>
            </div>


            <div class="admin-profile">

                <span>
                    <i class="fa-solid fa-user-shield"></i>
                </span>

                <div>
                    <strong>Administrator</strong>
                    <p>Admin</p>
                </div>

            </div>

        </header>


        <!-- ADD STUDENT -->
        <section class="content-box">

            <h2>Add New Student</h2>


            <form id="studentForm" class="student-form">

                <input
                    type="text"
                    id="studentName"
                    placeholder="Student Name"
                    required
                >


                <input
                    type="text"
                    id="rollNumber"
                    placeholder="Roll Number"
                    required
                >


                <input
                    type="email"
                    id="studentEmail"
                    placeholder="Email Address"
                    required
                >


                <select id="department" required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Software Engineering">
                        Software Engineering
                    </option>

                    <option value="Business Administration">
                        Business Administration
                    </option>

                    <option value="Engineering">
                        Engineering
                    </option>

                </select>


                <button type="submit">
                    <i class="fa-solid fa-plus"></i> Add Student
                </button>

            </form>

        </section>


        <!-- STUDENT LIST -->
        <section class="content-box student-list-box">

            <div class="list-header">

                <h2>All Students</h2>


                <input
                    type="text"
                    id="searchStudent"
                    placeholder="Search student..."
                >

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>Name</th>
                            <th>Roll No.</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Action</th>
                        </tr>

                    </thead>


                    <tbody id="studentTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
